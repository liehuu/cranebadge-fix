name: Build CraneBadgeFix

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache theos + SDKs
        uses: actions/cache@v4
        with:
          path: |
            ~/theos
            ~/theos/sdks
          key: theos-sdk-${{ runner.os }}-v1

      - name: Setup theos
        run: |
          export PATH="$HOME/theos/bin:$PATH"
          if [ -f "$HOME/theos/bin/nic.pl" ] && [ -d "$HOME/theos/sdks" ] && [ "$(ls "$HOME/theos/sdks" | wc -l)" -gt 0 ]; then
            echo "theos + SDK cached, skip install"
          else
            # 用重试包裹 install-theos，SDK 下载走 api.github.com 偶发失败
            for i in 1 2 3; do
              echo "install-theos attempt $i"
              if bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"; then
                break
              fi
              echo "retry in 10s..."
              sleep 10
            done
          fi
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "PATH=$HOME/theos/bin:$PATH" >> "$GITHUB_ENV"

      - name: Build tweak
        run: make package

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: CraneBadgeFix-deb
          path: packages/*.deb
          if-no-files-found: error
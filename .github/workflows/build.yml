name: build-dylib

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CraneBadgeFix dylib (arm64e, 直编无 theos)
        run: |
          set -e
          mkdir -p out
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          # 关键：RootHide 只支持 A12+（arm64e）设备；注入目标 SpringBoard /
          # runningboardd 是 arm64e 系统进程，dyld 按 cpusubtype 精确匹配，
          # 纯 arm64 dylib 会静默拒绝加载（不报错、无效果）。
          # 参考能用的补丁 cranepkdserverfix 即为 THIN 纯 arm64e，这里完全对齐：
          # 只编 arm64e，不编 arm64、不 lipo（少一步、编译更稳）。
          # MSHookFunction / dlsym 运行时解析（substrate/ellekit），链接期放行未定义符号。
          xcrun clang -arch arm64e -isysroot "$SDK" \
            -dynamiclib -fobjc-arc -undefined dynamic_lookup \
            -framework Foundation \
            main.m -o out/CraneBadgeFix.dylib \
            -Xlinker -install_name -Xlinker "@loader_path/.jbroot/Library/MobileSubstrate/DynamicLibraries/CraneBadgeFix.dylib"
          # adhoc 代码签名：RootHide 加载器跳过无签名的 dylib
          codesign --force --sign - out/CraneBadgeFix.dylib
          echo "--- dylib ---"
          file out/CraneBadgeFix.dylib

      - name: Package deb (标准库手写 ar + tar.gz)
        run: |
          set -e
          python3 build_deb.py
          echo "--- deb ---"
          ls -la out/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: CraneBadgeFix-deb
          path: out/*.deb
          if-no-files-found: error
name: build-dylib

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CraneBadgeFix dylib (arm64, 直编无 theos)
        run: |
          set -e
          mkdir -p out
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          # 与抖音 DouYinKeepPlay 同款直编方案：不装 theos、不下载 SDK、
          # 不依赖 api.github.com，零 flakiness。
          # MSHookFunction / dlsym 运行时解析（substrate/ellekit），链接期放行未定义符号。
          xcrun clang -target arm64-apple-ios13.0 -isysroot "$SDK" \
            -dynamiclib -fobjc-arc -undefined dynamic_lookup \
            -framework Foundation \
            main.m -o out/CraneBadgeFix.dylib \
            -Xlinker -install_name -Xlinker "@loader_path/.jbroot/Library/MobileSubstrate/DynamicLibraries/CraneBadgeFix.dylib"
          # adhoc 代码签名：RootHide 加载器跳过无签名的 dylib
          codesign --force --sign - out/CraneBadgeFix.dylib
          echo "--- dylib ---"
          file out/CraneBadgeFix.dylib
          lipo -info out/CraneBadgeFix.dylib

      - name: Package deb (标准库手写 ar + tar.gz)
        run: |
          set -e
          python3 build_deb.py
          echo "--- deb ---"
          ls -la out/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: CraneBadgeFix-deb
          path: out/*.deb
          if-no-files-found: error